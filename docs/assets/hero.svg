<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460" role="img" aria-labelledby="title desc">
  <title id="title">Local AI — your machine, your models</title>
  <desc id="desc">An Everforest-colored terminal illustration for a local AI workstation on Omarchy Linux and Framework Desktop, with a pixel processor, circuit paths, and command cursor. Designed for the AMD Ryzen AI Max+ 395 with 128 GiB of memory.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#475258" stroke-opacity=".2"/>
    </pattern>
  </defs>
  <rect width="1120" height="460" fill="#232a2e"/>
  <rect width="1120" height="460" fill="url(#grid)"/>
  <path d="M0 0H1120V460H0Z" fill="none" stroke="#475258" stroke-width="2"/>
  <path d="M40 48V318" stroke="#a7c080" stroke-width="4"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="64" y="66" fill="#a7c080" font-size="17" letter-spacing="2">LOCAL INFERENCE / OMARCHY EDITION</text>
    <text x="59" y="177" fill="#d3c6aa" font-size="103" font-weight="700" letter-spacing="-5">LOCAL AI</text>
    <text x="64" y="239" fill="#d3c6aa" font-size="29">Your machine.</text>
    <text x="64" y="278" fill="#a7c080" font-size="29">Your models.</text>
    <text x="64" y="319" fill="#9da9a0" font-size="18">A quiet home for powerful tools.</text>
    <text x="64" y="394" fill="#d3c6aa" font-size="18">Framework Desktop / Omarchy Linux</text>
    <text x="64" y="423" fill="#9da9a0" font-size="17">Ryzen AI Max+ 395 · 128 GiB</text>
  </g>
  <!-- A processor drawn as a terminal: circuit paths lead into a command cursor. -->
