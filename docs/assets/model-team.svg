<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="546" viewBox="0 0 1120 546" role="img" aria-labelledby="title desc">
  <title id="title">Three model tiers, one resident model</title>
  <desc id="desc">Everyday is the default install: Qwen 3.8 27B, Q4 with draft and vision artifacts, about 18.5 GiB. Optional Coder is Qwen3-Coder-Next Q4_K_M, about 45.1 GiB. Optional Senior is Qwen3.5-122B-A10B in community MXFP4_MOE, about 69.5 GiB. Sizes are locked downloads, not runtime RAM. Sticky routing uses the first complete tier in Everyday, Coder, Senior order. Only one model is resident at a time.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#475258" stroke-opacity=".17"/></pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1L6 4L1 7" fill="none" stroke="#9da9a0" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1120" height="546" fill="#272e33"/>
  <rect width="1120" height="546" fill="url(#grid)"/>
  <rect x=".5" y=".5" width="1119" height="545" fill="none" stroke="#475258"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace">
    <text x="40" y="43" fill="#a7c080" font-size="17" letter-spacing="2">THE MODEL TEAM</text>
    <text x="40" y="90" fill="#d3c6aa" font-size="31" font-weight="700">A small team. One resident.</text>
    <rect x="836" y="53" width="244" height="40" fill="#232a2e" stroke="#475258"/>
    <text x="858" y="79" fill="#a7c080" font-size="18">MODELS_MAX=1</text>
    <!-- Everyday -->
    <rect x="40" y="126" width="332" height="260" fill="#2e383c" stroke="#475258"/>
    <rect x="40" y="126" width="332" height="4" fill="#a7c080"/>
    <text x="62" y="162" fill="#a7c080" font-size="17">01 / DEFAULT INSTALL</text>
    <text x="62" y="204" fill="#d3c6aa" font-size="29" font-weight="700">Everyday</text>
    <text x="62" y="238" fill="#d3c6aa" font-size="20">Qwen 3.8 27B</text>
    <text x="62" y="266" fill="#9da9a0" font-size="17">Q4 + draft + vision</text>
    <text x="62" y="319" fill="#a7c080" font-size="34">18.5 <tspan font-size="19">GiB</tspan></text>
    <text x="62" y="362" fill="#d3c6aa" font-size="17">Build · test · iterate</text>
    <!-- Coder -->
    <rect x="394" y="126" width="332" height="260" fill="#2e383c" stroke="#475258"/>
    <rect x="394" y="126" width="332" height="4" fill="#7fbbb3"/>
    <text x="416" y="162" fill="#7fbbb3" font-size="17">02 / OPTIONAL</text>
    <text x="416" y="204" fill="#d3c6aa" font-size="29" font-weight="700">Coder</text>
    <text x="416" y="238" fill="#d3c6aa" font-size="20">Qwen3-Coder-Next</text>
    <text x="416" y="266" fill="#9da9a0" font-size="17">Q4_K_M · 4 parts</text>
    <text x="416" y="319" fill="#7fbbb3" font-size="34">45.1 <tspan font-size="19">GiB</tspan></text>
    <text x="416" y="362" fill="#d3c6aa" font-size="17">Explore · tools · debug</text>
    <!-- Senior -->
    <rect x="748" y="126" width="332" height="260" fill="#2e383c" stroke="#475258"/>
    <rect x="748" y="126" width="332" height="4" fill="#dbbc7f"/>
    <text x="770" y="162" fill="#dbbc7f" font-size="17">03 / OPTIONAL</text>
    <text x="770" y="204" fill="#d3c6aa" font-size="29" font-weight="700">Senior</text>
    <text x="770" y="238" fill="#d3c6aa" font-size="20">Qwen3.5-122B-A10B</text>
    <text x="770" y="266" fill="#9da9a0" font-size="17">MXFP4_MOE · community</text>
    <text x="770" y="319" fill="#dbbc7f" font-size="34">69.5 <tspan font-size="19">GiB</tspan></text>
    <text x="770" y="362" fill="#d3c6aa" font-size="17">Plan · reason · review</text>
    <text x="40" y="431" fill="#9da9a0" font-size="17">BASE PRIORITY</text>
    <text x="228" y="431" fill="#a7c080" font-size="18">Everyday</text>
    <path d="M332 425H401" fill="none" stroke="#9da9a0" marker-end="url(#arrow)"/>
    <text x="422" y="431" fill="#7fbbb3" font-size="18">Coder</text>
    <path d="M493 425H562" fill="none" stroke="#9da9a0" marker-end="url(#arrow)"/>
    <text x="583" y="431" fill="#dbbc7f" font-size="18">Senior</text>
    <text x="692" y="431" fill="#9da9a0" font-size="17">First complete tier wins.</text>
    <path d="M40 455H1080" stroke="#475258"/>
    <text x="40" y="489" fill="#d3c6aa" font-size="18">Sticky routing keeps the base warm. Switch specialists explicitly.</text>
    <text x="40" y="518" fill="#9da9a0" font-size="17">Approximate locked download sizes for default variants; not runtime RAM.</text>
  </g>
</svg>
